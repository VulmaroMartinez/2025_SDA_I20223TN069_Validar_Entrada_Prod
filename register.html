<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Registro empresa</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/validator@13.7.0/validator.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.0/build/js/intlTelInput.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.0/build/css/intlTelInput.css">
</head>

<body>
    <div class="container-fluid px-1 py-5 mx-auto">
        <div class="row d-flex justify-content-center">
            <div class="col-xl-7 col-lg-8 col-md-9 col-11 text-center">
                <h3>Registro de empresa</h3>

                <h5 class="text-center mb-4">Powering world-class companies</h5>
                <form class="form-card" onsubmit="return validateForm()">
                    <div class="row justify-content-between text-left">
                        <div class="form-group col-12 flex-column d-flex">
                            <label class="form-control-label px-3">Razón Social<span class="text-danger">
                                    *</span></label>
                            <input type="text" id="razonSocial" required oninput="checkForm()">
                            <pre id="error-razonSocial" style="color: red;"></pre>
                        </div>
                    </div>
                    <div class="row justify-content-between text-left">
                        <div class="form-group col-sm-6 flex-column d-flex">
                            <label class="form-control-label px-3">RFC<span class="text-danger"> *</span></label>
                            <input type="text" id="rfc" required oninput="checkForm()">
                            <pre id="error-rfc" style="color: red;"></pre>
                        </div>
                        <div class="form-group col-sm-6 flex-column d-flex">
                            <label class="form-control-label px-3">Teléfono<span class="text-danger"> *</span></label>
                            <input type="tel" id="phone" required oninput="checkForm()">
                            <pre id="error-phone" style="color: red;"></pre>
                        </div>
                    </div>
                    <div class="row justify-content-between text-left">
                        <div class="form-group col-12 flex-column d-flex">
                            <label class="form-control-label px-3">Contacto<span class="text-danger"> *</span></label>
                            <input type="text" id="contacto" required oninput="checkForm()">
                            <pre id="error-contacto" style="color: red;"></pre>
                        </div>
                    </div>
                    <div class="row justify-content-between text-left">
                        <div class="form-group col-sm-6 flex-column d-flex">
                            <label class="form-control-label px-3">Correo<span class="text-danger"> *</span></label>
                            <input type="text" id="email" required oninput="checkForm()">
                            <pre id="error-email" style="color: red;"></pre>
                        </div>
                    </div>

                    <div class="row justify-content-end">
                        <div class="form-group col-sm-6">
                            <button type="submit" class="btn-block btn-primary" id="submitBtn" disabled>Enviar</button>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script>
        let iti;

        document.addEventListener('DOMContentLoaded', () => {
            const input = document.querySelector("#phone");
            iti = window.intlTelInput(input, {
                initialCountry: "mx", // Cambia esto según el país por defecto
                loadUtils: () => import("https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.0/build/js/utils.js"),
            });
        });

        function checkForm() {
            const razonSocial = document.getElementById('razonSocial').value;
            const contacto = document.getElementById('contacto').value;
            const rfc = document.getElementById('rfc').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;

            const submitBtn = document.getElementById('submitBtn');

            if (!razonSocial.trim() ||
                !contacto.trim() ||
                !rfc.trim() ||
                !email.trim() ||
                !phone.trim()) {
                submitBtn.setAttribute('disabled', true);
                submitBtn.classList.remove('btn-primary');
                submitBtn.classList.add('btn-secondary');
            } else {
                submitBtn.removeAttribute('disabled');
                submitBtn.classList.remove('btn-secondary');
                submitBtn.classList.add('btn-primary');
            }
        }

        function validateForm() {
            const razonSocial = document.getElementById('razonSocial').value;
            const contacto = document.getElementById('contacto').value;
            const rfc = document.getElementById('rfc').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;

            const errorRazonSocial = document.getElementById('error-razonSocial');
            const errorContacto = document.getElementById('error-contacto');
            const errorRfc = document.getElementById('error-rfc');
            const errorEmail = document.getElementById('error-email');
            const errorPhone = document.getElementById('error-phone');

            let errors = [];

            if (razonSocial.length <= 5 && !razonSocial.trim()) {
                errors.push('Razón social muy corta');
                errorRazonSocial.textContent = 'Razón social muy corta';
            } else {
                errorRazonSocial.textContent = '';
            }

            if (contacto.length <= 2 && !contacto.trim()) {
                errors.push('Contacto debe tener más de 2 caracteres');
                errorContacto.textContent = 'Contacto debe tener más de 2 caracteres';
            } else {
                errorContacto.textContent = '';
            }

            const rfcPattern = /^([A-ZÑ&]{3,4}) ?(?:- ?)?(\d{2}(?:(?:0[1-9]|1[0-2])(?:0[1-9]|1[0-9]|2[0-8])|(?:0[469]|11)(?:29|30)|(?:0[13578]|1[02])(?:29|3[01]))|(?:0[048]|[2468][048]|[13579][26])0229) ?(?:- ?)?([A-Z\d]{2})([A\d])$/gm;
            if (!rfcPattern.test(rfc) && !rfc.trim()) {
                errors.push('RFC no válido');
                errorRfc.textContent = 'RFC no válido';
            } else {
                errorRfc.textContent = '';
            }

            if (!validator.isEmail(email) && !email.trim()) {
                errors.push('Correo no válido');
                errorEmail.textContent = 'Correo no válido';
            } else {
                errorEmail.textContent = '';
            }

            if (!phone.trim()) {
                errors.push('Teléfono requerido');
                errorPhone.textContent = 'Teléfono requerido';
            } else if (!iti.isValidNumber()) {
                const errorCode = iti.getValidationError();
                const errorMap = ["Número inválido", "Código de país inválido", "Demasiado corto", "Demasiado largo", "Número inválido"];
                const msg = errorMap[errorCode] || "Número inválido";
                errors.push(msg);
                errorPhone.textContent = msg;
            } else {
                errorPhone.textContent = '';
            }

            return errors.length === 0;
        }
    </script>

</body>

</html>
